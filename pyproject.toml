[project]
name = "pull-master"
version = "0.1.0"
description = "Reads GitHub issues over the GitHub MCP server, fixes them locally with Claude, runs the tests, and merges passing fixes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.2",
    "mcp>=2.3",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pull-master = "pull_master.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pull_master"]

[tool.pytest.ini_options]
testpaths = ["tests"]
